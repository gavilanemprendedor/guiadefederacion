<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Negocios | Guía de Federación</title>
<meta name="description" content="Negocios de Federación, Entre Ríos, agrupados por rubro.">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="site-header">
  <div class="container">
    <a href="index.html" class="logo">Guía de Federación</a>
  </div>
</header>

<div class="listado-header">
  <div class="container">
    <a class="back" href="index.html">← Volver a todos los rubros</a>
    <h1 id="rubro-titulo">Negocios</h1>
  </div>
</div>

<div id="lista-contenedor"></div>

<footer class="site-footer">
  <div class="container">
    <a href="https://instagram.com/guiadefederacion" target="_blank" rel="noopener">Instagram @guiadefederacion</a>
    <p style="margin-top:14px; color:#8a8578; font-size:0.82rem;">&copy; 2026 Guía de Federación</p>
  </div>
</footer>

<script src="data/negocios.js"></script>
<script src="js/main.js"></script>
<script>
  (function () {
    var params = new URLSearchParams(window.location.search);
    var rubro = params.get("rubro") || "";
    document.getElementById("rubro-titulo").textContent = rubro || "Negocios";
    document.title = (rubro || "Negocios") + " | Guía de Federación";

    var negocios = (typeof NEGOCIOS !== "undefined" ? NEGOCIOS : []).filter(function (n) {
      return n.rubro === rubro;
    });

    var contenedor = document.getElementById("lista-contenedor");

    if (negocios.length === 0) {
      contenedor.innerHTML =
        '<div class="empty-state reveal">' +
          '<p>Todavía no hay negocios cargados en <strong>' + rubro + '</strong>. ¿Sos vos el primero en sumarte?</p>' +
          '<a class="btn water" href="https://instagram.com/guiadefederacion" target="_blank" rel="noopener">Sumar mi negocio</a>' +
        '</div>';
    } else {
      var lista = document.createElement("div");
      lista.className = "negocio-list";
      negocios.forEach(function (n, i) {
        var item = document.createElement("a");
        item.href = n.instagram;
        item.target = "_blank";
        item.rel = "noopener";
        item.className = "negocio-item reveal reveal-" + ((i % 4) + 1);
        item.innerHTML =
          '<span class="nombre">' + n.nombre + '</span>' +
          '<span class="ig">Ver Instagram →</span>';
        lista.appendChild(item);
      });
      contenedor.appendChild(lista);
    }

    var revealEls = document.querySelectorAll(".reveal");
    if ("IntersectionObserver" in window) {
      var observer = new IntersectionObserver(function (entries) {
        entries.forEach(function (entry) {
          if (entry.isIntersecting) {
            entry.target.classList.add("is-visible");
            observer.unobserve(entry.target);
          }
        });
      }, { threshold: 0.15, rootMargin: "0px 0px -40px 0px" });
      revealEls.forEach(function (el) { observer.observe(el); });
    } else {
      revealEls.forEach(function (el) { el.classList.add("is-visible"); });
    }
  })();
</script>
</body>
</html>
